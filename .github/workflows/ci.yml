name: CI

# Lint/type/test/SAST/dependency-scan gate for the rebuild (apps/api,
# apps/web, packages/shared). Runs on every PR and on pushes to the
# integration branch. Entirely separate from deploy.yml, which only ever
# triggers on push to `main` and only touches the live boxes -- this
# workflow never deploys anything.
#
# The backend job needs no external services (no postgres/redis
# containers): the test suite spins up its own embedded Postgres 16 via
# the pip-installed `pgserver` package (tests/conftest.py) with real
# migrations, real RLS, and real triggers -- and Redis-dependent code is
# exercised against `fakeredis`. See docs/DECISIONS.md for why that's
# preferred over a services: block for this suite specifically.

# `main` is in the push list because it was not, and the gap showed: ruff and
# black had been failing on main for several commits with nothing to report
# it, since CI only ever ran on PRs and on the old integration branch while
# deploy.yml fires on main. Work reached the live boxes without this workflow
# having an opinion about it. Running here at least makes the drift visible;
# it does not yet BLOCK the deploy -- deploy.yml still triggers independently
# on the same push, so a red run and a successful deploy can still coexist.
# Gating one on the other is the follow-up (see docs/DECISIONS.md).
on:
  pull_request:
  push:
    branches: ["main", "rebuild/phase-0"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (apps/api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install apps/api
        working-directory: apps/api
        run: python -m pip install -e ".[dev]"

      - name: ruff
        working-directory: apps/api
        run: python -m ruff check src tests

      - name: black --check
        working-directory: apps/api
        run: python -m black --check src tests

      - name: mypy
        working-directory: apps/api
        run: python -m mypy src

      - name: no-float-money gate
        run: python scripts/check_no_float_money.py

      - name: pytest
        working-directory: apps/api
        run: python -m pytest -q

      - name: bandit (SAST)
        working-directory: apps/api
        run: python -m bandit -c pyproject.toml -r src

      - name: pip-audit (dependency scan)
        working-directory: apps/api
        run: python -m pip_audit --skip-editable

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
